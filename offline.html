<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8fafc">
<title>Connexion indisponible · LogiTrak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#f8fafc;color:#0f172a;
  font:15px/1.6 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;padding:24px;
}
main{
  max-width:500px;width:100%;background:#ffffff;border:1px solid #e2e8f0;
  border-radius:1.25rem;padding:36px;box-shadow:0 20px 35px -10px rgba(15,23,42,0.08);
  text-align:center;display:flex;flex-direction:column;align-items:center;
}
img{width:76px;height:76px;border-radius:18px;box-shadow:0 4px 20px rgba(2,132,199,0.25)}
h1{font-size:24px;font-weight:800;letter-spacing:-0.03em;line-height:1.2;margin:22px 0 10px;color:#0f172a}
p{color:#475569;font-size:14px;margin:0 0 12px;line-height:1.6}
button{
  margin-top:14px;background:linear-gradient(135deg,#ea580c 0%,#f97316 100%);
  color:#fff;border:0;border-radius:0.75rem;font:700 14px 'Plus Jakarta Sans',system-ui;
  padding:12px 26px;cursor:pointer;box-shadow:0 4px 16px rgba(234,88,12,0.35);
  transition:transform 0.2s cubic-bezier(0.16,1,0.3,1),box-shadow 0.2s;
  display:inline-flex;align-items:center;gap:8px;
}
button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(234,88,12,0.45)}
button:active{transform:scale(0.97)}
button:focus-visible{outline:2px solid #0284c7;outline-offset:3px}
</style>
</head>
<body>
<main>
<img src="./assets/app-icon-192.png" alt="LogiTrak">
<h1>Connexion indisponible</h1>
<p>LogiTrak ne peut pas charger cette page. Vérifiez votre connexion au réseau de l’usine ou à Internet, puis réessayez.</p>
<p>La consultation et la saisie en direct requièrent l’accès au serveur Supabase.</p>
<button type="button" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> Réessayer</button>
</main>
</body>
</html>
