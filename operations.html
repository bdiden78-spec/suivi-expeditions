  <script>if(location.protocol!=='file:'){const l=document.createElement('link');l.rel='manifest';l.href='./manifest.webmanifest';document.head.appendChild(l);}</script>

  <title>Suivi & alertes • LogiTrak</title>

  <script>
    (function () {
      try {
        var a = false;
        for (var i = 0; i < localStorage.length; i++) {
          if (/^sb-.*-auth-token$/.test(localStorage.key(i))) {
            var v = JSON.parse(localStorage.getItem(localStorage.key(i)));
            if ((v && v.user && v.user.email) || (v && v.currentSession && v.currentSession.user && v.currentSession.user.email)) {
              a = true; break;
            }
          }
        }
        if (!a) {
          var cur = encodeURIComponent(location.pathname.split('/').pop() || 'machines.html');
          location.replace('login.html?from=' + cur + (location.search ? encodeURIComponent(location.search) : ''));
        }
      } catch (e) {
        location.replace('login.html');
      }
    })();
  </script>
