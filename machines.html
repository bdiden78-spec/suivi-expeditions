<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14395f">
  <meta name="application-name" content="LogiTrak">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/app-icon-192.png">
  <meta name="description" content="Fabrication des étiquettes Algérie Poste — LogiTrak Eurequat Algérie">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <title>Paramètres • LogiTrak</title>

  <script>
    try {
      if (localStorage.getItem('logitrak_theme') !== 'dark')
        document.documentElement.classList.add('light');
    } catch(e) {}
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">

</head><body data-module="machines" class="min-h-screen flex flex-col">
  <header class="app-header relative z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 min-h-[4.25rem] py-2 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="app-brand"><img id="appBrandLogo" src="assets/logitrak-eurequat.jpg" alt="LogiTrak — Envoi et traçabilité" width="2752" height="1536" decoding="async"></div>
        <p class="site-label text-xs font-medium truncate hidden lg:block" style="color:var(--text-muted)"><i class="fa-solid fa-location-dot text-indigo-400 text-[10px] mr-1"></i>Usine Tlemcen • Suivi d'expéditions</p>
      </div>
      <div id="headerActions" class="flex items-center gap-2">
        <button onclick="toggleTheme()" class="btn-icon" title="Changer de thème" aria-label="Changer de thème"><i id="themeIcon" class="fa-solid fa-sun text-sm"></i></button>
      </div>
    </div>
  </header>


<main class="max-w-7xl mx-auto px-4 py-8 w-full flex-1 space-y-5">
  <div class="page-heading"><h1 class="text-xl font-extrabold">Paramètres</h1></div>
  <p id="machineMessage" role="status"></p>
  <section id="accountSettings" hidden class="panel p-5 space-y-3">
    <h2 class="font-bold">Utilisateurs</h2>
    <a class="btn btn-secondary" href="envois.html?admin=ops">Supprimer un compte</a>
    <form id="accountCreate" class="grid sm:grid-cols-3 gap-2">
      <label>Identifiant<input class="inp" name="username" required></label>
      <label>Mot de passe<input class="inp" name="password" type="password" minlength="8" required autocomplete="new-password"></label>
      <label>Rôle<select class="inp" name="role"><option value="operateur">Opérateur</option><option value="visionnaire">Visionnaire</option><option value="admin">Administrateur</option></select></label>
      <button class="btn btn-primary">Créer le compte</button>
    </form>
    <form id="accountEdit" class="grid sm:grid-cols-3 gap-2">
      <label>Compte<select class="inp" name="current" required></select></label>
      <label>Nouvel identifiant<input class="inp" name="username" required></label>
      <label>Nouveau mot de passe<input class="inp" name="password" type="password" autocomplete="new-password" placeholder="Laisser vide pour le conserver"></label>
      <button class="btn btn-primary">Enregistrer le compte</button>
    </form>
    <a class="btn btn-secondary" href="envois.html?admin=config">Réglages LogiTrak</a>
  </section>
  <form id="machineForm" hidden class="panel p-5 space-y-3">
    <h2 class="font-bold">Fiche machine</h2>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
      <label>Nom <input class="inp" name="nom" required maxlength="160"></label>
      <label>Marque <input class="inp" name="marque" required></label>
      <label>Référence <input class="inp" name="reference" required></label>
      <label>N° de série <input class="inp" name="numero_serie" required></label>
      <label>Mise en service <input class="inp" name="mise_en_service" type="date"></label>
      <label>État <select class="inp" name="etat"><option>En service</option><option>En maintenance</option><option>Hors service</option></select></label>
      <label>Prochain entretien préventif <input class="inp" name="prochain_preventif" type="date"></label>
      <label><input type="checkbox" name="imprimante_ap"> Imprimante Algérie Poste</label>
    </div>
    <label>Observations <textarea class="inp" name="notes"></textarea></label>
    <button type="submit" class="btn btn-primary">Enregistrer la fiche</button>
    <button id="machineReset" type="button" class="btn btn-secondary">Nouvelle fiche</button>
  </form>
  <div id="machineList" class="space-y-3"></div>
</main>
<script src="js/config.js"></script><script src="js/calendar.js"></script><script src="js/data-pages.js"></script>
<script src="js/machines.js"></script><script src="js/nav.js"></script><script src="js/pwa.js"></script>
</body></html>
